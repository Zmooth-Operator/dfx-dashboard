<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFX Asset Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      padding: 32px;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 18px; }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 { font-size: 24px; color: #ff6600; }
    
    #status { font-size: 14px; color: #666; }

    #controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    #controls input {
      flex: 1;
      min-width: 200px;
    }

    #controls select {
      flex: 1;
      min-width: 150px;
    }

    input, select {
      padding: 10px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    #stats {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 20px 28px;
      border: 1px solid #333;
      flex: 1;
      min-width: 120px;
    }

    .stat-card p { font-size: 13px; color: #666; margin-bottom: 6px; }
    .stat-card h2 { font-size: 28px; color: #ff6600; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .asset-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #333;
      transition: border-color 0.2s;
    }

    .asset-card:hover { border-color: #ff6600; }

    .asset-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .asset-blockchain {
      font-size: 12px;
      color: #666;
    }

    .loading { text-align: center; color: #666; padding: 60px; font-size: 18px; }

    #simulator {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 32px;
      border: 1px solid #333;
    }

    #simulator h2 {
      font-size: 16px;
      color: #ff6600;
      margin-bottom: 16px;
    }

    #sim-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #sim-controls input {
      flex: 1;
      min-width: 150px;
    }

    #sim-controls select {
      flex: 1;
      min-width: 150px;
    }

    #sim-result {
      font-size: 18px;
      color: #fff;
      min-height: 28px;
    }

    #sim-result span {
      color: #ff6600;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>DFX Asset Dashboard — Community Project</h1>
    <span id="status">Loading...</span>
  </header>

  <div id="stats">
    <div class="stat-card">
      <p>Total Assets</p>
      <h2 id="total-assets">—</h2>
    </div>
    <div class="stat-card">
      <p>Blockchains</p>
      <h2 id="total-blockchains">—</h2>
    </div>
  </div>

  <div id="controls">
    <input type="text" id="search" placeholder="Search asset..." oninput="render()">
    <select id="filter" onchange="render()">
      <option value="all">All Blockchains</option>
    </select>
  </div>

  <div id="simulator">
    <h2>Buy Simulator</h2>
    <div id="sim-controls">
      <input type="number" id="sim-amount" placeholder="Amount in EUR" oninput="simulate()">
      <select id="sim-coin" onchange="simulate()">
        <option value="bitcoin">Bitcoin (BTC)</option>
        <option value="ethereum">Ethereum (ETH)</option>
        <option value="solana">Solana (SOL)</option>
      </select>
    </div>
    <div id="sim-result"></div>
  </div>

  <div id="grid">
    <div class="loading">Fetching DFX assets...</div>
  </div>

  <script>
    async function simulate() {
      const amount = parseFloat(document.getElementById("sim-amount").value);
      const coin = document.getElementById("sim-coin").value;

      if (!amount || amount <= 0) {
        document.getElementById("sim-result").innerHTML = "";
        return;
      }

const response = await fetch(
  `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=eur`)}`
);

      const data = await response.json();
      const price = data[coin].eur;

      const dfxFee = 0.0149;
      const amountAfterFee = amount * (1 - dfxFee);
      const crypto = (amountAfterFee / price).toFixed(6);
      const feeAmount = (amount * dfxFee).toFixed(2);

      document.getElementById("sim-result").innerHTML = `
        Du bekommst: <span>${crypto} ${coin.toUpperCase()}</span><br>
        <small style="color:#666">DFX Gebühr: €${feeAmount} (1.49%) · Preis: €${price.toLocaleString()} per ${coin.toUpperCase()}</small>
      `;
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
